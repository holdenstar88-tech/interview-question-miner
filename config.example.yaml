# 面经流水线配置。相对路径以此配置文件所在目录为基准。

collect:
  # 目标主题说明；不会用于访问站点禁止的搜索页/接口。
  keywords:
    - "Java后端 面经"
    - "Java 一面"
    - "Agent 开发 面经"
    - "AI应用 面经"
    - "大模型应用 面试"
  # 请求间隔(秒),遵守低频采集纪律
  request_interval: 5
  # 每日采集帖数上限
  daily_limit: 200
  # 近 N 个自然日（含今天）；命令行 --days 可覆盖。
  days: 60
  # 正文缺失页面每天只复查一次，次日继续；网络错误仍按 max_retries 有限重试。
  page_attempts_per_day: 1
  max_requests_per_source: 40
  max_candidates_per_source: 80
  # 掘金最新分片站点地图约 8 MB；只读一个分片，最多取候选上限内的文章。
  max_response_bytes: 12000000
  timeout: 20
  # 失败重试次数(指数退避)
  max_retries: 3
  retry_backoff: 5
  page_retry_cooldown: 30
  user_agent: "MianjingPipeline/0.2 (personal study; respects robots.txt)"

# 按顺序运行：牛客为主，两站补充。每天合计最多 200 帖。
# 支持公开 HTML 列表、RSS/Atom、站点地图；seed_urls 可直接填公开文章链接。
# 实时检查 robots.txt；不提供忽略规则、解验证码或读取隐藏付费正文的开关。
sources:
  nowcoder:
    enabled: true
    # 单次运行的牛客 HTTP 请求上限；其他来源仍使用 collect.max_requests_per_source。
    max_requests_per_run: 320
    hosts: [www.nowcoder.com]
    discovery_urls: ["https://www.nowcoder.com/discuss"]
    seed_urls: []
    max_posts: 150
    # 包含入口页；跟进 HTML 内明确的公开分页链接。
    max_discovery_pages: 3
  csdn:
    enabled: true
    hosts: [blog.csdn.net]
    discovery_urls: ["https://blog.csdn.net/"]
    seed_urls: []
    max_posts: 25
    max_discovery_pages: 2
  juejin:
    enabled: true
    hosts: [juejin.cn]
    discovery_urls: ["https://juejin.cn/sitemap/posts/index1.xml"]
    seed_urls: []
    max_posts: 25
    max_discovery_pages: 1
  # 原需求中的辅助来源，默认关闭，优先保障上述三站的配额。
  # 使用 GitHub 明确开放的公共 REST API；不爬网页搜索，不读取私有仓库。
  github:
    enabled: false
    hosts: [api.github.com]
    repositories: []
    search_query: "面经"
    max_posts: 10
    max_discovery_pages: 2

filter:
  # 必须同时命中两组词才进入 LLM(命中"面试场景"词 且 命中"岗位相关"词)
  interview_words:
    - 面经
    - 面试
    - 一面
    - 二面
    - 三面
    - hr面
    - HR面
    - 凉经
    - offer
  position_words:
    - Java
    - java
    - JVM
    - Spring
    - MySQL
    - Redis
    - Kafka
    - MQ
    - 微服务
    - 并发
    - Agent
    - agent
    - LLM
    - 大模型
    - RAG
    - Function Call
    - Prompt
    - 微调
    - AI应用
    - 后端
  excluded_questions: [自我介绍, 个人介绍, 介绍自己, 你有什么想问, 有什么要问, 反问环节]

dedup:
  threshold: 0.9
  short_len: 30
  synonyms:
    请问: ""
    问一下: ""
    面试官问: ""
    讲一下: ""
    说说: ""

llm:
  # OpenAI 兼容协议(DeepSeek/GLM 等);key 留空则跳过抽取并提示
  base_url: "https://api.deepseek.com/v1"
  api_key: ""
  model: "deepseek-chat"
  # 每日 Token 预算,超限暂停抽取
  daily_token_budget: 500000
  # 超过此字符数的帖子分块抽取(控制单次 LLM 输出规模,防截断)
  chunk_chars: 3000
  max_tokens: 8192
  context_tokens: 64000
  max_retries: 2
  timeout: 90
  retry_backoff: 5
  confidence_threshold: 0.6
  temperature: 0.1
  # Optional: reasoning model effort (low/medium/high); omit for standard chat models.
  reasoning_effort: ""

output:
  raw_dir: "raw"
  db_path: "data/interviews.db"
  output_dir: "output"
  pending_dir: "output/pending"
  template_dir: "templates"
  log_dir: "logs"
  high_frequency_min_posts: 3
  recency_days: 60
  half_life_days: 14
  top_limit: 50
  log_max_bytes: 5000000
  log_backups: 3
